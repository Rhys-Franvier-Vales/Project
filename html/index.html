<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAMODAR</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font used in the Figma design (Krona One) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap"
      rel="stylesheet"
    />

    <!-- Custom styles -->
    <link href="/bootstrap/bootstrap.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Site header: logo, navbar, V-Connect -->
    <header class="site-header">
      <div class="header-inner">
        <img
          src="https://www.figma.com/api/mcp/asset/af6dfb05-7898-491f-881d-afa2e1ebe0da.png"
          alt="Shree Damodar College of Commerce &amp; Economics"
          class="site-logo"
        />

        <nav class="site-nav">
          <a href="#" class="nav-link">About Us</a>

          <div class="nav-item">
            <button type="button" class="nav-link dropdown-toggle">
              Admissions
            </button>
            <ul class="dropdown-menu">
              <li><a href="#">Undergraduate Programs</a></li>
              <li><a href="#">Postgraduate Programs</a></li>
              <li><a href="#">Admission Process</a></li>
            </ul>
          </div>

          <div class="nav-item">
            <button type="button" class="nav-link dropdown-toggle">
              Community
            </button>
            <ul class="dropdown-menu">
              <li><a href="#">Events</a></li>
              <li><a href="#">Notices</a></li>
              <li><a href="#">Alumni</a></li>
            </ul>
          </div>

          <div class="nav-item">
            <button type="button" class="nav-link dropdown-toggle">
              Student Services
            </button>
            <ul class="dropdown-menu">
              <li><a href="#">Library</a></li>
              <li><a href="#">Hostel</a></li>
              <li><a href="#">Transport</a></li>
            </ul>
          </div>

          <div class="nav-item">
            <button type="button" class="nav-link dropdown-toggle">
              Quick Links
            </button>
            <ul class="dropdown-menu">
              <li><a href="#">Result</a></li>
              <li><a href="#">Time Table</a></li>
              <li><a href="#">Syllabus</a></li>
            </ul>
          </div>
        </nav>

        <a href="#" class="v-connect-btn">V-Connect</a>
      </div>
    </header>

    <div class="parallax-wrapper">
      <section class="parallax-section" id="parallaxSection">
        <div class="parallax-card" id="parallaxCard">
          <!-- Layer 1: Sky Background (Depth 1) -->
          <div class="layer layer-sky" id="layerSky"></div>

          <!-- Layer 2: Title (Sandwiched 3D Typography) -->
          <h1 class="parallax-title" id="parallaxTitle" data-text="DAMODAR">
            DAMODAR
          </h1>

          <!-- Layer 3: Building Midground (Depth 2) -->
          <div class="layer layer-building-back" id="layerBuildingBack"></div>

          <!-- Glare / Lighting Effect -->
          <div class="parallax-glare" id="parallaxGlare"></div>
        </div>
      </section>
    </div>
    <!-- Custom script -->
    <script src="/js/script.js"></script>
  </body>
</html>
